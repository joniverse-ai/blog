<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" role="img" aria-label="퀴즈를 다 틀린 이유를 하나씩 벗긴 과정. 첫째, 404는 배포가 끝나기 2분 전에 옛 서버가 받은 것이라 기다렸다 다시 시험했다. 둘째, 문제가 열리는 순간 찍어 화면이 아직 바뀌기 전이라 1초 기다렸다 찍었다. 셋째, 연습 서버가 라운드마다 같은 문제 번호를 다시 써서 앱이 문제를 건너뛰어 번호와 열린 시각으로 구분했다. 넷째, 빨간 원을 세다 빨간 네모까지 세어 모양과 색을 하나씩 적고 세게 했다. 원인은 모두 앱 화면에 읽은 문제와 공개된 정답을 띄우고 나서 보였다">
  <rect width="960" height="390" rx="16" fill="#F5F6F2"/>
  <g font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif">
    <text x="32" y="44" font-size="20" font-weight="700" fill="#14213D">"다 틀렸어"를 한 겹씩 벗겨 보니</text>
    <text x="32" y="70" font-size="13" fill="#6A7280">앱 화면에 "에이전트가 읽은 문제"와 "공개된 정답"을 띄운 뒤에야 보인 것들</text>
    <g font-size="13">
      <g transform="translate(32,92)">
        <rect width="896" height="58" rx="10" fill="#FFFFFF" stroke="#DDE0E6"/>
        <circle cx="30" cy="29" r="15" fill="#D9622B"/><text x="30" y="34" text-anchor="middle" fill="#FFFFFF" font-weight="700">1</text>
        <text x="60" y="25" font-weight="700" fill="#14213D">풀이 요청이 404</text>
        <text x="60" y="45" fill="#6A7280">머지 직후, 배포가 끝나기 2분 전이라 옛 서버가 받음</text>
        <text x="600" y="35" fill="#2F5BD3" font-weight="700">→ /version 으로 버전부터 확인</text>
      </g>
      <g transform="translate(32,158)">
        <rect width="896" height="58" rx="10" fill="#FFFFFF" stroke="#DDE0E6"/>
        <circle cx="30" cy="29" r="15" fill="#D9622B"/><text x="30" y="34" text-anchor="middle" fill="#FFFFFF" font-weight="700">2</text>
        <text x="60" y="25" font-weight="700" fill="#14213D">하드모드 사진에 문제가 없음</text>
        <text x="60" y="45" fill="#6A7280">문제가 열리는 순간 찍어서, 노트북 화면이 아직 안 바뀜</text>
        <text x="600" y="35" fill="#2F5BD3" font-weight="700">→ 1초 기다렸다 찍기, 못 읽으면 다시</text>
      </g>
      <g transform="translate(32,224)">
        <rect width="896" height="58" rx="10" fill="#FFFFFF" stroke="#DDE0E6"/>
        <circle cx="30" cy="29" r="15" fill="#D9622B"/><text x="30" y="34" text-anchor="middle" fill="#FFFFFF" font-weight="700">3</text>
        <text x="60" y="25" font-weight="700" fill="#14213D">쉬운 글 문제까지 오답</text>
        <text x="60" y="45" fill="#6A7280">라운드마다 같은 번호(t1, s1…)를 다시 써서 "이미 푼 문제"로 건너뜀</text>
        <text x="600" y="35" fill="#2F5BD3" font-weight="700">→ 번호 + 열린 시각으로 구분</text>
      </g>
      <g transform="translate(32,290)">
        <rect width="896" height="58" rx="10" fill="#FFFFFF" stroke="#DDE0E6"/>
        <circle cx="30" cy="29" r="15" fill="#D9622B"/><text x="30" y="34" text-anchor="middle" fill="#FFFFFF" font-weight="700">4</text>
        <text x="60" y="25" font-weight="700" fill="#14213D">빨간 원 7개를 10개로</text>
        <text x="60" y="45" fill="#6A7280">그림에 빨간 네모가 섞여 있었음 → 빨간 도형을 다 셈</text>
        <text x="600" y="35" fill="#2F5BD3" font-weight="700">→ 모양과 색을 하나씩 적고 세기</text>
      </g>
    </g>
  </g>
</svg>
