<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-label="이번 주에 보이지 않던 것을 보이게 만든 여섯 장면. 11월 2일 200 OK 뒤의 단계를 Langfuse 트레이스로, 3일 괜찮아 보임을 데이터셋 점수로, 4일 무료의 비용을 메시지 한 건 원가로, 5일 웹 밖의 사용자를 폰 앱으로, 6일 퀴즈 오답 원인을 요청 기록과 읽은 문제 표시로, 9일 사용자가 말하지 않는 문제를 로그와 피드백으로 보이게 했다">
  <rect width="960" height="470" rx="16" fill="#F5F6F2"/>
  <g font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif">
    <text x="32" y="46" font-size="21" font-weight="700" fill="#14213D">이번 주: 안 보이던 것을 보이게 만든 여섯 장면</text>
    <text x="32" y="72" font-size="13" fill="#6A7280">왼쪽은 처음에 몰랐던 것, 오른쪽은 그것을 보게 해 준 것</text>

    <g font-size="13">
      <!-- row template: y base -->
      <g transform="translate(32,96)">
        <rect width="896" height="52" rx="10" fill="#FFFFFF" stroke="#DDE0E6"/>
        <text x="18" y="32" font-weight="700" fill="#2F5BD3">11/2</text>
        <text x="80" y="32" fill="#14213D">"200 OK" 뒤에서 무슨 일이 있었지?</text>
        <text x="470" y="32" fill="#D9622B" font-weight="700">→</text>
        <text x="500" y="32" fill="#14213D" font-weight="700">단계별 트레이스 (Langfuse)</text>
      </g>
      <g transform="translate(32,156)">
        <rect width="896" height="52" rx="10" fill="#FFFFFF" stroke="#DDE0E6"/>
        <text x="18" y="32" font-weight="700" fill="#2F5BD3">11/3</text>
        <text x="80" y="32" fill="#14213D">"괜찮아 보인다"는 정말 괜찮은가?</text>
        <text x="470" y="32" fill="#D9622B" font-weight="700">→</text>
        <text x="500" y="32" fill="#14213D" font-weight="700">데이터셋 + 평가 점수</text>
      </g>
      <g transform="translate(32,216)">
        <rect width="896" height="52" rx="10" fill="#FFFFFF" stroke="#DDE0E6"/>
        <text x="18" y="32" font-weight="700" fill="#2F5BD3">11/4</text>
        <text x="80" y="32" fill="#14213D">무료로 열어 두면 얼마가 나가지?</text>
        <text x="470" y="32" fill="#D9622B" font-weight="700">→</text>
        <text x="500" y="32" fill="#14213D" font-weight="700">메시지 한 건 원가 0.97원, 크레딧 원장</text>
      </g>
      <g transform="translate(32,276)">
        <rect width="896" height="52" rx="10" fill="#FFFFFF" stroke="#DDE0E6"/>
        <text x="18" y="32" font-weight="700" fill="#2F5BD3">11/5–6</text>
        <text x="80" y="32" fill="#14213D">브라우저 밖, 폰에서는 어떻게 보일까?</text>
        <text x="470" y="32" fill="#D9622B" font-weight="700">→</text>
        <text x="500" y="32" fill="#14213D" font-weight="700">Expo 앱, EAS 빌드로 설치까지</text>
      </g>
      <g transform="translate(32,336)">
        <rect width="896" height="52" rx="10" fill="#FFFFFF" stroke="#DDE0E6"/>
        <text x="18" y="32" font-weight="700" fill="#2F5BD3">11/6</text>
        <text x="80" y="32" fill="#14213D">퀴즈를 왜 다 틀렸지?</text>
        <text x="470" y="32" fill="#D9622B" font-weight="700">→</text>
        <text x="500" y="32" fill="#14213D" font-weight="700">요청 기록, "읽은 문제"·정답 표시</text>
      </g>
      <g transform="translate(32,396)">
        <rect width="896" height="52" rx="10" fill="#14213D"/>
        <text x="18" y="32" font-weight="700" fill="#F2A65A">11/9</text>
        <text x="80" y="32" fill="#FFFFFF">사용자는 무엇이 문제인지 말해 주지 않는다</text>
        <text x="470" y="32" fill="#F2A65A" font-weight="700">→</text>
        <text x="500" y="32" fill="#FFFFFF" font-weight="700">로그 + 피드백 → 데이터셋 → 버전별 확인</text>
      </g>
    </g>
  </g>
</svg>
