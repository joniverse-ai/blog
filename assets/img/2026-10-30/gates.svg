<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" role="img" aria-label="코드가 사용자에게 가는 길에 세운 문들. 작업 브랜치에서 PR을 열면 CI 테스트(5장), staging 배포와 직접 써 보기(5장), production 승인(5장)을 거친다. 2주차에는 이미지를 한 번만 만들어 승격하고(7장), 0% 배포와 스모크 테스트 뒤 전환한다(9장). 브랜치 보호(5장)가 지름길을 막는다">
  <defs><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6A7280"/></marker></defs>
  <rect width="960" height="330" rx="16" fill="#F5F6F2"/>
  <g font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" text-anchor="middle">
    <text x="32" y="44" font-size="20" font-weight="700" fill="#14213D" text-anchor="start">코드가 사용자에게 가는 길에 세운 문들</text>
    <g font-size="14">
      <rect x="24" y="96" width="112" height="70" rx="12" fill="#14213D"/>
      <text x="80" y="126" fill="#F5F6F2" font-weight="700">내 코드</text><text x="80" y="148" fill="#C9D3E3" font-size="12">작업 브랜치</text>

      <rect x="164" y="96" width="120" height="70" rx="12" fill="#FFFFFF" stroke="#2F5BD3" stroke-width="2"/>
      <text x="224" y="126" fill="#14213D" font-weight="700">CI 테스트</text><text x="224" y="148" fill="#2F5BD3" font-size="12">5장 · PR마다</text>

      <rect x="312" y="96" width="140" height="70" rx="12" fill="#FFFFFF" stroke="#2F5BD3" stroke-width="2"/>
      <text x="382" y="126" fill="#14213D" font-weight="700">staging에서 써 보기</text><text x="382" y="148" fill="#2F5BD3" font-size="12">5장 · 사람 눈</text>

      <rect x="480" y="96" width="120" height="70" rx="12" fill="#FFFFFF" stroke="#2F5BD3" stroke-width="2"/>
      <text x="540" y="126" fill="#14213D" font-weight="700">내 승인</text><text x="540" y="148" fill="#2F5BD3" font-size="12">5장 · 나가는 시점</text>

      <rect x="628" y="96" width="140" height="70" rx="12" fill="#E1F5EE" stroke="#1F7A5C" stroke-width="2"/>
      <text x="698" y="122" fill="#14213D" font-weight="700">0% → 스모크</text><text x="698" y="142" fill="#14213D" font-weight="700">→ 전환</text><text x="698" y="160" fill="#1F7A5C" font-size="12">9장</text>

      <rect x="796" y="96" width="140" height="70" rx="12" fill="#1F7A5C"/>
      <text x="866" y="126" fill="#F5F6F2" font-weight="700">사용자</text><text x="866" y="148" fill="#CDEBDF" font-size="12">production</text>
    </g>
    <g stroke="#6A7280" stroke-width="2" fill="none" marker-end="url(#g)">
      <path d="M138 131H160"/><path d="M286 131H308"/><path d="M454 131H476"/><path d="M602 131H624"/><path d="M770 131H792"/>
    </g>
    <rect x="164" y="190" width="436" height="40" rx="10" fill="#E6ECF7"/>
    <text x="382" y="216" font-size="14" fill="#14213D"><tspan font-weight="700">브랜치 보호</tspan> (5장) · 직접 push와 빨간 X 머지라는 지름길을 막는다</text>
    <rect x="312" y="244" width="456" height="40" rx="10" fill="#E1F5EE"/>
    <text x="540" y="270" font-size="14" fill="#14213D"><tspan font-weight="700">이미지는 한 번만</tspan> (7장) · staging에서 본 그 이미지를 승격</text>
    <text x="32" y="312" font-size="13" fill="#6A7280" text-anchor="start">파란 문 = 1주차, 초록 문 = 2주차 · 4장 자동 배포는 이 길 전체를 사람 손 없이 돌게 만든 것</text>
  </g>
</svg>
