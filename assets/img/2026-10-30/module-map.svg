<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-label="2주 동안의 지도. 1주차 만들고 내보내기: 1장 설계, 2장 첫 배포, 3장 운영, 4장 자동 배포, 5장 CI와 staging. 2주차 끊김 없이 내보내기: 6장 Dockerfile, 7장 이미지 한 번, 8장 로드밸런서, 9장 Cloud Run 무중단 배포">
  <rect width="960" height="430" rx="16" fill="#F5F6F2"/>
  <g font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif">
    <text x="32" y="44" font-size="20" font-weight="700" fill="#14213D">2주 지도 · 질문이 이렇게 바뀌었다</text>

    <text x="32" y="92" font-size="15" font-weight="700" fill="#2F5BD3">1주차 · 만들고 내보내기</text>
    <text x="928" y="92" font-size="14" fill="#6A7280" text-anchor="end">"올라갔나?" → "계속 잘 돌아가나?"</text>
    <path d="M64 160 H896" stroke="#C9D3E3" stroke-width="5" stroke-linecap="round"/>
    <g font-size="14" text-anchor="middle">
      <circle cx="96" cy="160" r="20" fill="#2F5BD3"/><text x="96" y="165" fill="#F5F6F2" font-weight="700">1</text>
      <text x="96" y="204" font-weight="700" fill="#14213D">설계</text><text x="96" y="224" fill="#4A5568">채널 · PRD</text>
      <circle cx="296" cy="160" r="20" fill="#2F5BD3"/><text x="296" y="165" fill="#F5F6F2" font-weight="700">2</text>
      <text x="296" y="204" font-weight="700" fill="#14213D">첫 배포</text><text x="296" y="224" fill="#4A5568">키는 금고에</text>
      <circle cx="496" cy="160" r="20" fill="#2F5BD3"/><text x="496" y="165" fill="#F5F6F2" font-weight="700">3</text>
      <text x="496" y="204" font-weight="700" fill="#14213D">운영</text><text x="496" y="224" fill="#4A5568">시간 · 개수 · 비용</text>
      <circle cx="696" cy="160" r="20" fill="#2F5BD3"/><text x="696" y="165" fill="#F5F6F2" font-weight="700">4</text>
      <text x="696" y="204" font-weight="700" fill="#14213D">자동 배포</text><text x="696" y="224" fill="#4A5568">머지하면 배포</text>
      <circle cx="896" cy="160" r="20" fill="#2F5BD3"/><text x="896" y="165" fill="#F5F6F2" font-weight="700">5</text>
      <text x="896" y="204" font-weight="700" fill="#14213D">CI · staging</text><text x="896" y="224" fill="#4A5568">문 세 개</text>
    </g>

    <text x="32" y="282" font-size="15" font-weight="700" fill="#1F7A5C">2주차 · 끊김 없이 내보내기</text>
    <text x="928" y="282" font-size="14" fill="#6A7280" text-anchor="end">"바뀌는 순간, 사용자는 오류를 봤나?"</text>
    <path d="M96 340 H864" stroke="#C9D3E3" stroke-width="5" stroke-linecap="round"/>
    <g font-size="14" text-anchor="middle">
      <circle cx="160" cy="340" r="20" fill="#1F7A5C"/><text x="160" y="345" fill="#F5F6F2" font-weight="700">6</text>
      <text x="160" y="384" font-weight="700" fill="#14213D">Dockerfile</text><text x="160" y="404" fill="#4A5568">환경을 파일로</text>
      <circle cx="400" cy="340" r="20" fill="#1F7A5C"/><text x="400" y="345" fill="#F5F6F2" font-weight="700">7</text>
      <text x="400" y="384" font-weight="700" fill="#14213D">이미지 한 번</text><text x="400" y="404" fill="#4A5568">본 그 이미지를 그대로</text>
      <circle cx="640" cy="340" r="20" fill="#D9622B"/><text x="640" y="345" fill="#F5F6F2" font-weight="700">8</text>
      <text x="640" y="384" font-weight="700" fill="#14213D">로드밸런서</text><text x="640" y="404" fill="#4A5568">사라진 대화</text>
      <circle cx="864" cy="340" r="20" fill="#1F7A5C"/><text x="864" y="345" fill="#F5F6F2" font-weight="700">9</text>
      <text x="864" y="384" font-weight="700" fill="#14213D">무중단 배포</text><text x="864" y="404" fill="#4A5568">머지 한 번이면</text>
    </g>
  </g>
</svg>
