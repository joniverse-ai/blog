<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-label="내 배포 흐름: 사람이 PR 머지와 승인을 하면 워크플로가 새 리비전을 0%로 올리고, 태그 URL로 스모크 테스트를 한 뒤 통과하면 100% 전환한다. 스모크 테스트가 실패하면 전환하지 않는다">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6A7280"/></marker></defs>
  <rect width="960" height="360" rx="16" fill="#F5F6F2"/>
  <g font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" text-anchor="middle">
    <text x="32" y="44" font-size="20" font-weight="700" fill="#14213D" text-anchor="start">사람은 두 번, 나머지는 워크플로가</text>
    <g font-size="15">
      <rect x="24" y="88" width="150" height="86" rx="12" fill="#14213D"/>
      <text x="99" y="118" fill="#F2A65A" font-size="13" font-weight="700">사람</text><text x="99" y="148" fill="#F5F6F2" font-weight="700">PR 머지</text>
      <rect x="208" y="88" width="150" height="86" rx="12" fill="#14213D"/>
      <text x="283" y="118" fill="#F2A65A" font-size="13" font-weight="700">사람</text><text x="283" y="148" fill="#F5F6F2" font-weight="700">승인 버튼</text>
      <rect x="392" y="88" width="170" height="86" rx="12" fill="#FFFFFF" stroke="#2F5BD3" stroke-width="2"/>
      <text x="477" y="118" fill="#2F5BD3" font-size="13" font-weight="700">① 워크플로</text><text x="477" y="142" fill="#14213D" font-weight="700">새 버전 0%</text><text x="477" y="162" fill="#4A5568" font-size="13">+ green 태그</text>
      <rect x="596" y="88" width="170" height="86" rx="12" fill="#FFFFFF" stroke="#2F5BD3" stroke-width="2"/>
      <text x="681" y="118" fill="#2F5BD3" font-size="13" font-weight="700">② 워크플로</text><text x="681" y="142" fill="#14213D" font-weight="700">스모크 테스트</text><text x="681" y="162" fill="#4A5568" font-size="13">태그 URL로 확인</text>
      <rect x="800" y="88" width="136" height="86" rx="12" fill="#1F7A5C"/>
      <text x="868" y="118" fill="#CDEBDF" font-size="13" font-weight="700">③ 워크플로</text><text x="868" y="148" fill="#F5F6F2" font-weight="700">100% 전환</text>
    </g>
    <g stroke="#6A7280" stroke-width="2" fill="none" marker-end="url(#a)">
      <path d="M176 131H204"/><path d="M360 131H388"/><path d="M564 131H592"/><path d="M768 131H796"/>
      <path d="M681 176V228"/>
    </g>
    <rect x="566" y="232" width="230" height="64" rx="12" fill="#FBE9DF" stroke="#D9622B" stroke-width="2"/>
    <text x="681" y="258" font-size="14" font-weight="700" fill="#B04A1A">실패하면 여기서 멈춤</text>
    <text x="681" y="280" font-size="13" fill="#4A5568">③ 건너뜀 · 사용자는 이전 버전</text>
    <rect x="24" y="232" width="510" height="64" rx="12" fill="#E6ECF7"/>
    <text x="279" y="258" font-size="14" font-weight="700" fill="#14213D">0%인 동안 사용자는 계속 이전 버전</text>
    <text x="279" y="280" font-size="13" fill="#4A5568">나만 green---… 주소로 새 버전을 미리 본다</text>
    <text x="32" y="332" font-size="13" fill="#6A7280" text-anchor="start">문제가 생기면 Actions의 rollback 버튼 하나로 이전 리비전에 트래픽 100%</text>
  </g>
</svg>
