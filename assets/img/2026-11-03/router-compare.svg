<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" role="img" aria-label="도구 선택 지시문 v1과 v2를 41개로 두 번씩 비교. 다음 공휴일 T26은 v1에서 한 번 틀렸고 v2에서 두 번 다 맞았다. 시험 전날 T34는 네 번 모두 틀렸다. 내일 날씨 T13은 v1에서 맞고 v2에서 두 번 다 미세먼지 도구를 덧붙였다">
  <rect width="960" height="330" rx="16" fill="#F5F6F2"/>
  <g font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif">
    <text x="32" y="44" font-size="20" font-weight="700" fill="#14213D">규칙 두 줄을 더한 도구 선택 지시문 v2</text>
    <text x="32" y="70" font-size="13" fill="#6A7280">tool-selection 41개 · 버전마다 2번 · 총점 v1 35, 34 / v2 34, 33</text>

    <g font-size="13" font-weight="700" fill="#6A7280" text-anchor="middle">
      <text x="378" y="104">v1 · 1회</text><text x="458" y="104">v1 · 2회</text>
      <text x="558" y="104">v2 · 1회</text><text x="638" y="104">v2 · 2회</text>
    </g>
    <path d="M508 88V300" stroke="#DDE0E6" stroke-width="2"/>

    <g font-size="14" fill="#14213D">
      <text x="32" y="148" font-weight="700">T26 "다음 공휴일 언제야?"</text>
      <text x="32" y="216" font-weight="700">T34 "금요일 시험 전날 밤"</text>
      <text x="32" y="284" font-weight="700">T13 "내일 날씨 어때?"</text>
    </g>

    <!-- 맞음 = 파랑 원, 틀림 = 주황 원 -->
    <g font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">
      <circle cx="378" cy="143" r="18" fill="#2F5BD3"/><text x="378" y="149">✓</text>
      <circle cx="458" cy="143" r="18" fill="#D9622B"/><text x="458" y="149">✗</text>
      <circle cx="558" cy="143" r="18" fill="#2F5BD3"/><text x="558" y="149">✓</text>
      <circle cx="638" cy="143" r="18" fill="#2F5BD3"/><text x="638" y="149">✓</text>

      <circle cx="378" cy="211" r="18" fill="#D9622B"/><text x="378" y="217">✗</text>
      <circle cx="458" cy="211" r="18" fill="#D9622B"/><text x="458" y="217">✗</text>
      <circle cx="558" cy="211" r="18" fill="#D9622B"/><text x="558" y="217">✗</text>
      <circle cx="638" cy="211" r="18" fill="#D9622B"/><text x="638" y="217">✗</text>

      <circle cx="378" cy="279" r="18" fill="#2F5BD3"/><text x="378" y="285">✓</text>
      <circle cx="458" cy="279" r="18" fill="#2F5BD3"/><text x="458" y="285">✓</text>
      <circle cx="558" cy="279" r="18" fill="#D9622B"/><text x="558" y="285">✗</text>
      <circle cx="638" cy="279" r="18" fill="#D9622B"/><text x="638" y="285">✗</text>
    </g>

    <g font-size="13">
      <text x="690" y="140" font-weight="700" fill="#2F5BD3">해석 문제 → 규칙으로 고쳐짐</text>
      <text x="690" y="160" fill="#6A7280">"기간 없으면 인자를 비운다"</text>
      <text x="690" y="208" font-weight="700" fill="#D9622B">계산 문제 → 안 고쳐짐</text>
      <text x="690" y="228" fill="#6A7280">네 번 다 같은 틀린 날짜 → 코드로</text>
      <text x="690" y="276" font-weight="700" fill="#D9622B">회귀 → v2 승격 안 함</text>
      <text x="690" y="296" fill="#6A7280">두 번 다 미세먼지 도구를 덧붙임</text>
    </g>
  </g>
</svg>
