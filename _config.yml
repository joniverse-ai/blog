# Config
# ========================================================================================

url:                   https://joniverse-ai.github.io
baseurl:               /blog


# General settings
# ---------------------------------------------------------------------------------------

lang:                  ko

title:                 johnny의 에이전트 일지

description:           >
  18년 차 브랜드 디자이너가 AI 에이전트를 공부하며 남기는 학습 일지.

tagline:               브랜드 디자이너, AI 에이전트를 배우다

keywords:              [AI, 에이전트, 브랜드디자인, Claude, Jekyll]

author:
  name:                johnny
  email:               joniverse.j9@gmail.com

menu:
  - title:             About
    url:               /about/

legal:
  - title:             License
    url:               /LICENSE/

copyright:             © 2026 johnny

permalink:             /:categories/:year-:month-:day-:title/

paginate:              10
paginate_path:         /page-:num/


# Theme
# ---------------------------------------------------------------------------------------

theme: jekyll-theme-hydejack


# Customization
# ----------------------------------------------------------------------------------------

accent_color:          rgb(79,177,186)
theme_color:           rgb(25,55,71)

defaults:
  - scope:
      path:            assets/
    values:
      sitemap:         false


# Hydejack Settings
# ----------------------------------------------------------------------------------------

hydejack:
  post_addons:         [about, related, random]
  no_mark_external:    false
  no_push_state:       false
  no_drawer:           false
  no_navbar:           false
  no_search:           false
  no_inline_css:       false
  no_page_style:       false
  no_break_layout:     true
  no_toc:              false
  no_third_column:     false
  no_large_headings:   false
  no_structured_data:  false
  no_theme_color:      false
  no_breadcrumbs:      false
  use_lsi:             false
  cookies_banner:      false
  advertise:           false
  hide_dates:          false
  hide_last_modified:  true

  dark_mode:
    always:            false
    dynamic:           true
    icon:              true


# File inclusion/exclusion
# ----------------------------------------------------------------------------------------

exclude:
  - .jekyll-cache
  - .sass-cache
  - vendor
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE


# Plugins
# ----------------------------------------------------------------------------------------

plugins:
  - jekyll-default-layout
  - jekyll-feed
  - jekyll-paginate
  - jekyll-redirect-from
  - jekyll-relative-links
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-include-cache


# Plugin Configs
# ---------------------------------------------------------------------------------------

relative_links:
  collections:         true

compress_html:
  comments:            ["<!--", "-->"]
  clippings:           all
  endings:             all
  ignore:
    envs:              [development]

sass:
  style:               compressed
